# project name pinned to the pre-rename value so compose reuses the existing db container/volume instead of creating an empty one
name: freelanceos
services:
  db:
    image: postgres:16-alpine
    container_name: freelanceos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freelanceos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
